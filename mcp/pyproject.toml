[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "galen-mcp"
version = "0.1.0"
description = "MCP server for the Galen First Drafts: machine first-draft English of untranslated Galen works, by Kühn citation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Galen Density Project" }]
dependencies = [
    "mcp>=1.10",
    "platformdirs>=3",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Montblanctech/Galen/tree/master/mcp"
Drafts = "https://montblanctech.github.io/Galen/first-drafts/"

[project.scripts]
galen-mcp = "galen_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
galen_mcp = ["catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
