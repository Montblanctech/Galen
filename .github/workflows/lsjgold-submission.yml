# LSJ-Gold submissions: a pull request that adds submissions/<system>/<stem>.jsonl token caches is scored here with the
# audit kit's own `lsjgold` command (gold CSV shipped inside the kit, CC BY 4.0). The table lands in the job summary and
# the JSON as an artifact; the maintainers then regenerate docs/lsj-gold/ for the next version. No model runs here.
name: LSJ-Gold submission score
on:
  pull_request:
    paths:
      - "submissions/**"
      - "audit-kit/**"
  workflow_dispatch:
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the audit kit
        run: python -m pip install --quiet ./audit-kit
      - name: Score every submitted system
        run: |
          mkdir -p out
          if [ -d submissions ] && find submissions -mindepth 2 -name "*.jsonl" | grep -q .; then
            greek-lemma-audit lsjgold --system-cache submissions --out out/lsjgold_submission_scores.json | tee out/table.md
          else
            echo "no submissions/<system>/<stem>.jsonl found" | tee out/table.md
          fi
      - name: Job summary
        run: cat out/table.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lsjgold-submission-scores
          path: out/
